name: Publish UpPear 1.0.0

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-uppear-1.0.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uppear-1.0.0-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository_id == '1265804815'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the prepared release snapshot
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          git init --quiet .
          git remote add origin "https://github.com/$RELEASE_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$RELEASE_COMMIT"
          git checkout --detach FETCH_HEAD
      - name: Publish the author-provided App DMG and core source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        working-directory: releases/1.0.0
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          if gh release view uppear-v1.0.0 > /dev/null 2>&1; then
            echo "Release already exists; leaving its assets unchanged."
            exit 0
          fi
          gh release create uppear-v1.0.0 \
            UpPear-1.0.0-macOS-arm64.dmg \
            UpPear-1.0.0-source.zip \
            SHA256SUMS.txt \
            --target "$RELEASE_COMMIT" \
            --title "UpPear 1.0.0" \
            --notes-file RELEASE_NOTES.md \
            --latest
